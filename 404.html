<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Page not found | Abhinav Singh</title>
<link rel="icon" href="/abhinav-portfolio/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/abhinav-portfolio/logo-as.png" type="image/png">
<style>
  /* Self-contained on purpose: GitHub Pages serves this from any bad path,
     so fonts load by absolute URL and everything else is inline. */
  @font-face { font-family:"Archivo"; font-weight:800; font-display:swap;
    src:url("/abhinav-portfolio/fonts/archivo-latin-800-normal.woff2") format("woff2"); }
  @font-face { font-family:"IBM Plex Sans"; font-weight:400; font-display:swap;
    src:url("/abhinav-portfolio/fonts/ibm-plex-sans-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family:"IBM Plex Mono"; font-weight:400; font-display:swap;
    src:url("/abhinav-portfolio/fonts/ibm-plex-mono-latin-400-normal.woff2") format("woff2"); }
  :root {
    --paper:#f7f6f2; --surface:#fbfaf7; --ink:#15171b; --ink-soft:#3f4450;
    --muted:#6c7180; --line-strong:#c4c2ba; --red:#b8322b; --grid:rgba(21,23,27,0.035);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper:#0f1113; --surface:#13161a; --ink:#ecebe7; --ink-soft:#b4b8c1;
      --muted:#80869a; --line-strong:#3a3f48; --red:#e4675d; --grid:rgba(236,234,230,0.03);
    }
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:"IBM Plex Sans",system-ui,sans-serif; background:var(--paper); color:var(--ink);
    line-height:1.6; min-height:100vh; display:grid; place-items:center;
    padding:clamp(1rem,4vw,3rem);
  }
  .sheet {
    border:1.5px solid var(--ink); position:relative; max-width:560px; width:100%;
    padding:clamp(1.75rem,5vw,3rem); background-color:var(--surface);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size:24px 24px;
  }
  .sheet::before { content:""; position:absolute; inset:6px; border:1px solid var(--line-strong); pointer-events:none; }
  .kicker { font-family:"IBM Plex Mono",monospace; font-size:0.75rem; letter-spacing:0.08em;
    text-transform:uppercase; color:var(--muted); margin-bottom:1rem; }
  h1 { font-family:"Archivo",sans-serif; font-weight:800; font-size:clamp(2rem,7vw,2.8rem);
    line-height:1.05; letter-spacing:-0.03em; margin-bottom:0.75rem; }
  p.sub { color:var(--ink-soft); max-width:44ch; margin-bottom:1.75rem; }
  .btn { display:inline-block; font-size:0.92rem; text-decoration:none;
    padding:0.8rem 1.2rem; border-radius:3px; background:var(--ink); color:var(--paper); }
  .btn:hover { background:var(--red); color:#fff; }
</style>
</head>
<body>
  <main class="sheet">
    <p class="kicker">Error 404</p>
    <h1>Page not found</h1>
    <p class="sub">This page doesn't exist or has moved. The portfolio is one page, so everything is a click away from the home page.</p>
    <a class="btn" href="/abhinav-portfolio/">Back to the portfolio</a>
  </main>
</body>
</html>
