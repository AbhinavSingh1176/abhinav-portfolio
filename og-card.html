<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<title>OG card source — not a page</title>
<!-- ================================================================
  SOURCE for og-image.png (the 1200x630 card shown when the site is
  shared on LinkedIn, iMessage, Slack). Not linked from anywhere.
  Regenerate after a headline change — command in README.
================================================================ -->
<style>
  @font-face { font-family:"Archivo"; font-weight:800; src:url("fonts/archivo-latin-800-normal.woff2") format("woff2"); }
  @font-face { font-family:"Archivo"; font-weight:600; src:url("fonts/archivo-latin-600-normal.woff2") format("woff2"); }
  @font-face { font-family:"IBM Plex Mono"; font-weight:400; src:url("fonts/ibm-plex-mono-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family:"IBM Plex Mono"; font-weight:500; src:url("fonts/ibm-plex-mono-latin-500-normal.woff2") format("woff2"); }
  /* Fixed light palette — link previews don't have a dark mode. */
  :root {
    --paper:#f7f6f2; --surface:#fbfaf7; --ink:#15171b; --ink-soft:#3f4450; --muted:#6c7180;
    --line-strong:#c4c2ba; --red:#b8322b; --grid:rgba(21,23,27,0.04);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1200px; height:630px; overflow:hidden; }
  body { background:var(--paper); color:var(--ink); }
  .sheet {
    position:absolute; inset:34px; border:2px solid var(--ink);
    background-color:var(--surface);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size:28px 28px;
    padding:62px 64px 0; display:flex; flex-direction:column;
  }
  .sheet::before { content:""; position:absolute; inset:8px; border:1px solid var(--line-strong); }
  .kicker { font-family:"IBM Plex Mono",monospace; font-size:18px; letter-spacing:0.1em;
    text-transform:uppercase; color:var(--muted); margin-bottom:22px; }
  h1 { font-family:"Archivo",sans-serif; font-weight:800; font-size:96px; line-height:1;
    letter-spacing:-0.03em; margin-bottom:26px; }
  .lede { font-family:"Archivo",sans-serif; font-weight:600; font-size:34px; line-height:1.25;
    letter-spacing:-0.01em; max-width:24ch; }
  .lede em { font-style:normal; color:var(--red); }
  .title-block { margin-top:auto; margin-bottom:44px; position:relative;
    display:grid; grid-template-columns:1.2fr 1.2fr 1fr; border:1.5px solid var(--ink); background:var(--surface); }
  .title-block > div { padding:12px 20px 14px; border-right:1px solid var(--line-strong);
    display:flex; flex-direction:column; gap:4px; }
  .title-block > div:last-child { border-right:none; }
  .title-block span { font-family:"IBM Plex Mono",monospace; font-size:13px; letter-spacing:0.1em;
    text-transform:uppercase; color:var(--muted); }
  .title-block strong { font-family:"IBM Plex Mono",monospace; font-size:20px; font-weight:500; }
</style>
</head>
<body>
  <div class="sheet">
    <p class="kicker">Mechanical Engineer · Purdue ME '28</p>
    <h1>Abhinav Singh</h1>
    <p class="lede">Thermal systems, hardware design, and test&nbsp;&amp;&nbsp;validation.</p>
    <div class="title-block">
      <div><span>Current</span><strong>Cummins Inc. · Co-op</strong></div>
      <div><span>Seeking</span><strong>Summer 2027 internships</strong></div>
      <div><span>Portfolio</span><strong>abhinavsingh1176.github.io</strong></div>
    </div>
  </div>
</body>
</html>
